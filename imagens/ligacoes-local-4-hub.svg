<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-label="Ligações em modo local com 4 sensores, com Hub">
<title>Ligações em modo local com 4 sensores, com Hub</title>
<rect width="980" height="400" fill="#ffffff"/>
<rect x="30" y="40" width="120" height="52" rx="8" fill="#fdf2e9" stroke="#af601a" stroke-width="2"/>
<text x="90.0" y="62.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2631">Sensor 1</text>
<text x="90.0" y="80.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">HALL Unit</text>
<line x1="150" y1="66" x2="300" y2="66" stroke="#34495e" stroke-width="3"/>
<text x="225.0" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">Porta A · GPIO 39</text>
<rect x="30" y="125" width="120" height="52" rx="8" fill="#fdf2e9" stroke="#af601a" stroke-width="2"/>
<text x="90.0" y="147.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2631">Sensor 2</text>
<text x="90.0" y="165.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">HALL Unit</text>
<line x1="150" y1="151" x2="300" y2="151" stroke="#34495e" stroke-width="3"/>
<text x="225.0" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">Porta B · GPIO 8</text>
<rect x="30" y="210" width="120" height="52" rx="8" fill="#fdf2e9" stroke="#af601a" stroke-width="2"/>
<text x="90.0" y="232.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2631">Sensor 3</text>
<text x="90.0" y="250.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">HALL Unit</text>
<line x1="150" y1="236" x2="300" y2="236" stroke="#34495e" stroke-width="3"/>
<text x="225.0" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">Porta C · GPIO 6</text>
<rect x="300" y="30" width="190" height="250" rx="8" fill="#eaf4ea" stroke="#1e8449" stroke-width="2"/>
<text x="395.0" y="124.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2631">Mestre</text>
<text x="395.0" y="142.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">AtomS3 Lite + Port ABC Base</text>
<text x="395.0" y="160.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631"></text>
<text x="395.0" y="178.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">Portas A, B, C à esquerda</text>
<text x="395.0" y="196.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">Grove à direita</text>
<line x1="490" y1="146" x2="570" y2="146" stroke="#111111" stroke-width="4"/>
<line x1="490" y1="152" x2="570" y2="152" stroke="#d62728" stroke-width="4"/>
<line x1="490" y1="158" x2="570" y2="158" stroke="#f1c40f" stroke-width="4"/>
<line x1="490" y1="164" x2="570" y2="164" stroke="#7f8c8d" stroke-width="5"/>
<line x1="490" y1="164" x2="570" y2="164" stroke="#ffffff" stroke-width="3"/>
<text x="530.0" y="137" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">Grove</text>
<rect x="570" y="110" width="100" height="90" rx="8" fill="#f4ecf7" stroke="#76448a" stroke-width="2"/>
<text x="620.0" y="151.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2631">Unit Hub</text>
<text x="620.0" y="169.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">(Grove)</text>
<line x1="670" y1="91" x2="830" y2="91" stroke="#111111" stroke-width="4"/>
<line x1="670" y1="97" x2="830" y2="97" stroke="#d62728" stroke-width="4"/>
<line x1="670" y1="103" x2="830" y2="103" stroke="#f1c40f" stroke-width="4"/>
<line x1="670" y1="109" x2="830" y2="109" stroke="#7f8c8d" stroke-width="5"/>
<line x1="670" y1="109" x2="830" y2="109" stroke="#ffffff" stroke-width="3"/>
<text x="750.0" y="82" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">Grove: branco = GPIO 1</text>
<rect x="830" y="70" width="120" height="60" rx="8" fill="#fdf2e9" stroke="#af601a" stroke-width="2"/>
<text x="890.0" y="96.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2631">Sensor 4</text>
<text x="890.0" y="114.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">HALL Unit</text>
<line x1="670" y1="201" x2="830" y2="201" stroke="#111111" stroke-width="4"/>
<line x1="670" y1="207" x2="830" y2="207" stroke="#d62728" stroke-width="4"/>
<line x1="670" y1="213" x2="830" y2="213" stroke="#f1c40f" stroke-width="4"/>
<line x1="670" y1="219" x2="830" y2="219" stroke="#7f8c8d" stroke-width="5"/>
<line x1="670" y1="219" x2="830" y2="219" stroke="#ffffff" stroke-width="3"/>
<text x="750.0" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">Grove: amarelo = GPIO 2</text>
<rect x="830" y="180" width="120" height="60" rx="8" fill="#fbeaea" stroke="#a93226" stroke-width="2"/>
<text x="890.0" y="206.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2631">Relay Unit</text>
<text x="890.0" y="224.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">(relé)</text>
<rect x="830" y="270" width="120" height="50" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="2"/>
<text x="890.0" y="291.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2631">Fechadura</text>
<text x="890.0" y="309.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">NO / COM</text>
<line x1="890" y1="240" x2="890" y2="270" stroke="#555" stroke-width="3"/>
<text x="30" y="360" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1b2631">Cabo Grove (4 fios):</text>
<rect x="170" y="349" width="14" height="14" rx="3" fill="#111111" stroke="none"/>
<text x="190" y="360" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">preto = GND</text>
<rect x="280.6" y="349" width="14" height="14" rx="3" fill="#d62728" stroke="none"/>
<text x="300.6" y="360" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">vermelho = 5 V</text>
<rect x="411.0" y="349" width="14" height="14" rx="3" fill="#f1c40f" stroke="none"/>
<text x="431.0" y="360" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">amarelo = GPIO 2 (relé)</text>
<rect x="600.8" y="349" width="14" height="14" rx="3" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="620.8" y="360" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">branco = GPIO 1 (sensor 4)</text>
<text x="30" y="384" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">O sensor 4 (GPIO 1) e o relé (GPIO 2) usam o mesmo Grove do Mestre, por isso o Hub é necessário.</text>
</svg>
