<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="Ligações em modo remoto: Mestre com sensores, Remoto com o relé">
<title>Ligações em modo remoto: Mestre com sensores, Remoto com o relé</title>
<rect width="1000" height="480" fill="#ffffff"/>
<rect x="30" y="40" width="120" height="52" rx="8" fill="#fdf2e9" stroke="#af601a" stroke-width="2"/>
<text x="90.0" y="62.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2631">Sensor 1</text>
<text x="90.0" y="80.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">HALL Unit</text>
<line x1="150" y1="66" x2="300" y2="66" stroke="#34495e" stroke-width="3"/>
<text x="225.0" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">Porta A · GPIO 39</text>
<rect x="30" y="125" width="120" height="52" rx="8" fill="#fdf2e9" stroke="#af601a" stroke-width="2"/>
<text x="90.0" y="147.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2631">Sensor 2</text>
<text x="90.0" y="165.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">HALL Unit</text>
<line x1="150" y1="151" x2="300" y2="151" stroke="#34495e" stroke-width="3"/>
<text x="225.0" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">Porta B · GPIO 8</text>
<rect x="30" y="210" width="120" height="52" rx="8" fill="#fdf2e9" stroke="#af601a" stroke-width="2"/>
<text x="90.0" y="232.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2631">Sensor 3</text>
<text x="90.0" y="250.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">HALL Unit</text>
<line x1="150" y1="236" x2="300" y2="236" stroke="#34495e" stroke-width="3"/>
<text x="225.0" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">Porta C · GPIO 6</text>
<rect x="300" y="30" width="190" height="250" rx="8" fill="#eaf4ea" stroke="#1e8449" stroke-width="2"/>
<text x="395.0" y="124.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2631">Mestre</text>
<text x="395.0" y="142.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">AtomS3 Lite + Port ABC Base</text>
<text x="395.0" y="160.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631"></text>
<text x="395.0" y="178.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">Portas A, B, C à esquerda</text>
<text x="395.0" y="196.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">Grove à direita</text>
<rect x="640" y="60" width="120" height="52" rx="8" fill="#fdf2e9" stroke="#af601a" stroke-width="2"/>
<text x="700.0" y="82.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2631">Sensor 4</text>
<text x="700.0" y="100.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">HALL Unit</text>
<line x1="490" y1="77" x2="640" y2="77" stroke="#111111" stroke-width="4"/>
<line x1="490" y1="83" x2="640" y2="83" stroke="#d62728" stroke-width="4"/>
<line x1="490" y1="89" x2="640" y2="89" stroke="#f1c40f" stroke-width="4"/>
<line x1="490" y1="95" x2="640" y2="95" stroke="#7f8c8d" stroke-width="5"/>
<line x1="490" y1="95" x2="640" y2="95" stroke="#ffffff" stroke-width="3"/>
<text x="565.0" y="68" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">Grove: branco = GPIO 1</text>
<rect x="640" y="230" width="150" height="70" rx="8" fill="#eaf4ea" stroke="#1e8449" stroke-width="2"/>
<text x="715.0" y="261.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2631">Remoto</text>
<text x="715.0" y="279.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">AtomS3 Lite</text>
<line x1="490" y1="255" x2="640" y2="265" stroke="#2874a6" stroke-width="3" stroke-dasharray="8 6"/>
<text x="565.0" y="243" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2874a6">ESP-NOW (rádio, canal 1)</text>
<rect x="850" y="230" width="120" height="70" rx="8" fill="#fbeaea" stroke="#a93226" stroke-width="2"/>
<text x="910.0" y="261.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2631">Relay Unit</text>
<text x="910.0" y="279.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">(relé)</text>
<line x1="790" y1="256" x2="850" y2="256" stroke="#111111" stroke-width="4"/>
<line x1="790" y1="262" x2="850" y2="262" stroke="#d62728" stroke-width="4"/>
<line x1="790" y1="268" x2="850" y2="268" stroke="#f1c40f" stroke-width="4"/>
<line x1="790" y1="274" x2="850" y2="274" stroke="#7f8c8d" stroke-width="5"/>
<line x1="790" y1="274" x2="850" y2="274" stroke="#ffffff" stroke-width="3"/>
<text x="820.0" y="247" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">Grove</text>
<text x="895" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631"></text>
<text x="820" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">amarelo = GPIO 2</text>
<rect x="850" y="340" width="120" height="50" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="2"/>
<text x="910.0" y="361.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2631">Fechadura</text>
<text x="910.0" y="379.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2631">NO / COM</text>
<line x1="910" y1="300" x2="910" y2="340" stroke="#555" stroke-width="3"/>
<text x="30" y="430" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1b2631">Cabo Grove (4 fios):</text>
<rect x="170" y="419" width="14" height="14" rx="3" fill="#111111" stroke="none"/>
<text x="190" y="430" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">preto = GND</text>
<rect x="280.6" y="419" width="14" height="14" rx="3" fill="#d62728" stroke="none"/>
<text x="300.6" y="430" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">vermelho = 5 V</text>
<rect x="411.0" y="419" width="14" height="14" rx="3" fill="#f1c40f" stroke="none"/>
<text x="431.0" y="430" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">amarelo = GPIO 2 (relé)</text>
<rect x="600.8" y="419" width="14" height="14" rx="3" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="620.8" y="430" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">branco = GPIO 1 (sensor 4)</text>
<text x="30" y="454" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b2631">Não é preciso Hub: o relé está no Remoto e o Grove do Mestre fica livre para o sensor 4 (GPIO 1).</text>
</svg>
